<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get WorkAway International recruitment announcements and application updates through our WhatsApp Community.">
  <title>WorkAway International | Recruitment Updates</title>
  <style>
    :root { --navy:#102a43; --blue:#1769aa; --red:#d62839; --ink:#172b4d; --muted:#526579; --pale:#f3f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:linear-gradient(140deg,#eef5fc 0%,#fff 55%,#fdf1f2 100%); min-height:100vh; }
    header { padding:22px 6vw; display:flex; align-items:center; justify-content:space-between; gap:16px; background:#fff; border-bottom:1px solid #e4ebf2; }
    .brand { display:flex; align-items:center; gap:14px; font-weight:800; letter-spacing:.3px; color:var(--navy); min-width:0; }
    .brand-logo { display:block; width:76px; height:76px; object-fit:contain; flex:0 0 auto; }
    .brand-name { line-height:1.15; }
    .brand-name .workaway { color:var(--navy); }
    .brand-name .away { color:var(--red); }
    @media(max-width:420px){ .brand-logo{width:58px;height:58px}.brand{gap:9px}.brand-name{font-size:14px} }
    .tag { font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); }
    main { width:min(900px,90%); margin:62px auto 50px; text-align:center; }
    .eyebrow { display:inline-block; padding:8px 13px; border-radius:999px; background:#e1efff; color:#14518a; font-size:13px; font-weight:700; }
    h1 { margin:22px 0 16px; font-size:clamp(34px,6vw,58px); line-height:1.08; letter-spacing:-1.6px; color:var(--navy); }
    h1 span { color:var(--red); }
    .intro { max-width:680px; margin:0 auto; font-size:18px; line-height:1.7; color:var(--muted); }
    .panel { max-width:650px; margin:32px auto 0; padding:30px; border-radius:22px; background:#fff; box-shadow:0 16px 50px rgba(16,42,67,.10); border:1px solid #e7edf4; }
    .panel h2 { margin:0 0 12px; font-size:24px; color:var(--navy); }
    .panel p { color:var(--muted); line-height:1.65; margin:0 0 22px; }
    .join { display:inline-block; padding:16px 24px; border-radius:12px; background:#168b53; color:white; text-decoration:none; font-size:17px; font-weight:800; box-shadow:0 7px 18px rgba(22,139,83,.22); }
    .join:hover { background:#107343; }
    .small { font-size:12px!important; margin:16px 0 0!important; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:28px 0 0; text-align:left; }
    .step { background:rgba(255,255,255,.8); border:1px solid #e5ecf4; border-radius:14px; padding:18px; }
    .num { color:var(--red); font-weight:900; font-size:13px; }
    .step strong { display:block; margin:8px 0; }
    .step p { color:var(--muted); font-size:14px; line-height:1.5; margin:0; }
    .notice { max-width:720px; margin:28px auto 0; font-size:13px; line-height:1.6; color:#657487; }
    footer { padding:24px; text-align:center; color:#68798b; font-size:12px; border-top:1px solid #e4ebf2; background:rgba(255,255,255,.65); }
    @media(max-width:650px){ header{padding:18px 5vw} main{margin-top:38px}.panel{padding:24px 18px}.steps{grid-template-columns:1fr}.intro{font-size:16px}.tag{display:none} }
  </style>
</head>
